name: Release (Cross-compile ARM)

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            label: linux-x64
          # ARM64 Linux (Raspberry Pi, ARM servers)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            label: linux-arm64
          # x86_64 macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            label: macos-x64
          # ARM64 macOS (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            label: macos-arm64
          # x86_64 Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            label: windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross-compilation toolchain (Linux ARM only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static gcc-aarch64-linux-gnu

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p geo-cli

      - name: Strip binary (not Windows)
        if: matrix.os != 'windows-latest'
        run: |
          strip target/${{ matrix.target }}/release/geo-toolbox || true

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a ../../../geo-toolbox-${{ matrix.label }}.zip geo-toolbox.exe
          else
            tar czf ../../../geo-toolbox-${{ matrix.label }}.tar.gz geo-toolbox
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            geo-toolbox-${{ matrix.label }}.tar.gz
            geo-toolbox-${{ matrix.label }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
