[package]
name = "geo-parquet"
version.workspace = true
description = "GeoParquet reader/writer — cloud-native vector format with spatial predicate pushdown"
edition.workspace = true
license.workspace = true

[features]
# NOTE: This crate is currently a metadata/schema skeleton only — real
# Parquet read/write I/O is NOT implemented (reader/writer return
# GeoError::Unimplemented). Arrow/Parquet machinery is therefore NOT pulled
# in by default. Enable the `arrow` feature once a real backend lands.
default = []
# Full Arrow/Parquet support for cloud-native pipelines (optional, opt-in)
arrow = ["dep:parquet", "dep:arrow", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-csv"]

[dependencies]
geo-core = { path = "../geo-core" }
geo-types.workspace = true
geo.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true

# Arrow ecosystem (optional — enables full Parquet I/O)
parquet = { version = "53", optional = true, features = ["arrow"] }
arrow = { version = "53", optional = true }
arrow-array = { version = "53", optional = true }
arrow-schema = { version = "53", optional = true }
arrow-csv = { version = "53", optional = true }
