[package]
name = "geo-adapters-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Simulation adapters: MODFLOW, DSSAT, IoT"

[features]
default = ["modflow", "dssat", "iot"]
modflow = []
dssat = []
iot = []
mqtt = ["dep:rumqttc"]

[dependencies]
geo-core = { path = "../../core/geo-core" }
geo-registry = { path = "../../core/geo-registry", features = ["tokio-runtime"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
csv.workspace = true
uuid.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"], optional = true }
rumqttc = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true
